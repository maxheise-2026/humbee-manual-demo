name: Handbuch prüfen

# Läuft bei jedem Pull Request. Erzeugt ein Vorschau-PDF als Artefakt,
# damit im Review sichtbar ist, was freigegeben wird.

on:
  pull_request:
    paths:
      - "content/**"
      - "templates/**"
      - "scripts/**"
      - "manual.yml"
  workflow_dispatch:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Inhalte prüfen
        run: python scripts/validate.py

      - name: Wiki-Paket bauen (Probelauf, es wird nichts gesendet)
        run: |
          python scripts/build_wiki.py
          python scripts/push_ingest.py --dry-run

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Schriften bereitstellen
        run: sudo apt-get update && sudo apt-get install -y fonts-crosextra-carlito fonts-dejavu

      - name: Vorschau-PDF bauen
        run: python scripts/build_print.py

      - uses: actions/upload-artifact@v4
        with:
          name: handbuch-vorschau
          path: |
            dist/*.pdf
            build/wiki/changes.json
          retention-days: 14
