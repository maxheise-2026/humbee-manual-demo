name: Handbuch freigeben

# Läuft nach dem Merge nach main. Der Wiki-Teil wird übersprungen, solange
# kein Ingest-Endpunkt hinterlegt ist - das PDF entsteht trotzdem.

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "templates/**"
      - "scripts/**"
      - "manual.yml"
  workflow_dispatch:

concurrency:
  group: freigabe
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  freigeben:
    runs-on: ubuntu-latest

    # Auf Job-Ebene, damit die Werte auch im "if:" der Schritte lesbar sind.
    env:
      HUMBEE_INGEST_ENDPOINT: ${{ secrets.HUMBEE_INGEST_ENDPOINT }}
      HUMBEE_INGEST_TOKEN: ${{ secrets.HUMBEE_INGEST_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Inhalte prüfen
        run: python scripts/validate.py

      # --- Teil 1: LLM-Wiki, nur wenn der Agent angebunden ist -------------
      - name: Ingest-Paket bauen
        run: python scripts/build_wiki.py

      - name: Wiki-Auslieferung übersprungen
        if: env.HUMBEE_INGEST_ENDPOINT == ''
        run: |
          echo "::notice::Kein Ingest-Endpunkt hinterlegt - Wiki-Auslieferung übersprungen."
          echo "Diese Änderungen bleiben offen:"
          cat build/wiki/changes.json

      - name: Änderungen an den Ingest-Agenten melden
        if: env.HUMBEE_INGEST_ENDPOINT != ''
        run: python scripts/push_ingest.py

      - name: Ausgelieferten Stand festschreiben
        if: env.HUMBEE_INGEST_ENDPOINT != ''
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/ingest-manifest.json
            git commit -m "chore: ausgelieferten Wiki-Stand festgeschrieben [skip ci]"
            git push
          fi

      # --- Teil 2: Druckhandbuch -------------------------------------------
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Schriften bereitstellen
        run: sudo apt-get update && sudo apt-get install -y fonts-crosextra-carlito fonts-dejavu

      - name: PDF bauen
        run: python scripts/build_print.py

      - uses: actions/upload-artifact@v4
        with:
          name: handbuch-pdf
          path: dist/*.pdf
          retention-days: 90

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pdf
